name: Build KTX macro APK

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - "ktx/ktx_booking.py"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release로 발행할 태그명 (예: v1.0.0). 비우면 Release를 만들지 않고 APK 아티팩트만 생성."
        required: false
        default: ""

jobs:
  test:
    name: Verify Korail port (JS vs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python reference deps
        run: python3 -m pip install korail2-ncard pycryptodome
      - name: Install mobile deps
        working-directory: mobile
        run: npm install
      - name: Run parity + logic tests
        working-directory: mobile
        run: npm test

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # allow attaching the APK to a Release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install mobile deps
        working-directory: mobile
        run: npm install
      - name: Build web assets
        working-directory: mobile
        run: npm run build
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android
      - name: Set app version (so upgrades install over old builds)
        working-directory: mobile
        run: |
          VN=$(cat VERSION)
          VC=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VN}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ktx-auto-booking.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktx-auto-booking-apk
          path: ktx-auto-booking.apk
      - name: Read version
        id: ver
        run: echo "tag=$(cat mobile/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish APK to a Release
        # Publishes when: a v* tag is pushed, dispatched with release_tag, or a
        # branch push whose commit message contains [release]. softprops creates
        # the tag + release server-side (GITHUB_TOKEN), so no local tag push is
        # needed (the sandbox git proxy blocks tag pushes).
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
          contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          files: ktx-auto-booking.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag) || steps.ver.outputs.tag }}
          name: KTX 자동 예매 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            폰에 설치하는 KTX 자동 예매 앱입니다.

            **설치:** 아래 `ktx-auto-booking.apk`를 폰으로 받아 실행 → "출처를 알 수 없는 앱 설치" 허용 후 설치하세요(디버그 서명 경고는 정상).

            결제는 자동화하지 않습니다. 예약 성공 후 코레일 앱에서 결제하세요.
