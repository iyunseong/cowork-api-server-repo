<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d91" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KTX 자동 예매</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="logo">🚄</span>
        <h1>KTX 자동 예매</h1>
      </div>
      <p class="subtitle">빈자리를 자동으로 잡아드려요 · 결제는 코레일 앱에서</p>
    </header>

    <main>
      <!-- Alarm banner -->
      <div id="alarm" class="alarm hidden" role="alert">
        <div class="alarm-inner">
          <span class="alarm-emoji">🎉</span>
          <div>
            <strong id="alarm-title">예약 완료!</strong>
            <p id="alarm-body"></p>
          </div>
          <button id="alarm-dismiss" class="ghost small">확인</button>
        </div>
      </div>

      <!-- Login -->
      <section class="card">
        <h2>1 · 코레일 로그인</h2>
        <p class="hint">입력한 정보는 <b>저장하지 않고</b> 이 요청에만 사용됩니다.</p>
        <label>아이디 (회원번호·이메일·휴대폰)
          <input id="id" type="text" autocomplete="username" inputmode="text" placeholder="예: 010-1234-5678" />
        </label>
        <label>비밀번호
          <input id="password" type="password" autocomplete="current-password" placeholder="코레일 비밀번호" />
        </label>
      </section>

      <!-- Trip -->
      <section class="card">
        <h2>2 · 여정</h2>
        <div class="row">
          <label>출발역
            <input id="dep" type="text" list="stations" placeholder="서울" />
          </label>
          <label>도착역
            <input id="arr" type="text" list="stations" placeholder="부산" />
          </label>
        </div>
        <datalist id="stations">
          <option value="서울"></option><option value="용산"></option>
          <option value="광명"></option><option value="천안아산"></option>
          <option value="오송"></option><option value="대전"></option>
          <option value="동대구"></option><option value="부산"></option>
          <option value="울산"></option><option value="포항"></option>
          <option value="광주송정"></option><option value="목포"></option>
          <option value="여수엑스포"></option><option value="강릉"></option>
          <option value="남춘천"></option><option value="행신"></option>
        </datalist>
        <div class="row">
          <label>날짜
            <input id="date" type="date" />
          </label>
          <label>이 시각 이후
            <input id="time" type="time" value="09:00" />
          </label>
        </div>
        <div class="row">
          <label>열차 종류
            <select id="trainType">
              <option value="ktx">KTX / KTX-산천</option>
              <option value="itx-saemaeul">ITX-새마을</option>
              <option value="itx-cheongchun">ITX-청춘</option>
              <option value="mugunghwa">무궁화호</option>
              <option value="nuriro">누리로</option>
              <option value="all">전체</option>
            </select>
          </label>
          <label>좌석
            <select id="seatOption">
              <option value="general-first">일반실 우선</option>
              <option value="general-only">일반실만</option>
              <option value="special-first">특실 우선</option>
              <option value="special-only">특실만</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>성인
            <input id="adults" type="number" min="0" max="9" value="1" />
          </label>
          <label>어린이
            <input id="children" type="number" min="0" max="9" value="0" />
          </label>
          <label>경로
            <input id="seniors" type="number" min="0" max="9" value="0" />
          </label>
        </div>
        <label class="check">
          <input id="tryWaiting" type="checkbox" />
          좌석이 없으면 <b>예약 대기</b>까지 시도
        </label>
      </section>

      <!-- Search results -->
      <section class="card">
        <h2>3 · 열차 조회</h2>
        <button id="search-btn" class="primary">열차 조회</button>
        <div id="search-status" class="status-line"></div>
        <div id="results"></div>
      </section>

      <!-- Macro -->
      <section class="card">
        <h2>4 · 자동 예매 매크로</h2>
        <div class="row">
          <label>조회 간격(초)
            <input id="intervalSec" type="number" min="10" max="300" value="15" />
          </label>
          <label>최대 시간(분)
            <input id="maxMinutes" type="number" min="1" max="720" value="60" />
          </label>
        </div>
        <button id="auto-btn" class="primary">가장 빠른 빈자리 자동 예매</button>
        <p class="hint">특정 열차를 지정하려면 위 조회 결과에서 <b>이 열차 매크로</b>를 누르세요.</p>

        <div id="job-panel" class="job hidden">
          <div class="job-head">
            <span id="job-badge" class="badge">실행 중</span>
            <button id="stop-btn" class="ghost small">중지</button>
          </div>
          <div id="job-detail" class="job-detail"></div>
          <div id="job-message" class="job-message"></div>
        </div>
      </section>

      <p class="footer">
        결제는 자동화하지 않습니다. 예약 성공 시 코레일 앱/홈페이지에서 결제하세요.<br />
        코레일 anti-bot 정책에 따라 과도한 반복 조회는 피합니다.
      </p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
